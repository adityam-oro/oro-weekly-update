<div class="sub-label"><div class="sub-label-bar"></div><div class="sub-label-text">Key Highlights</div></div>
<div class="hl-grid">
  <div class="hl-box good">
    <div class="hl-title">&#10003; What Worked Well</div>
    <ul>
      <li>Second half recovery: Apr 13-28 delivered Rs 51.4 Cr ND vs Rs 27.4 Cr in the first half -- nearly double.</li>
      <li>Takeover recovered from Rs 1.2 Cr (Wk 14) to Rs 11-12 Cr in Wks 15-17.</li>
      <li>AUM crossed Rs 1,182 Cr with consistent week-on-week growth across all 4 weeks.</li>
      <li>Hyderabad DVs closed at 85% -- strong conversion from visit to loan.</li>
      <li>Chennai DV conversion at 72.3% vs 70.6% target -- only city to beat DV conversion target.</li>
      <li>Week 16 was our best week: Rs 30.2 Cr ND, 481 loans, 1.70% AUM growth.</li>
    </ul>
